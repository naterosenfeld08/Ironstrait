# Auto-merge agent PRs into main when safe.
# Eligible: head branch cursor/** OR label "automerge"; base must be main; not draft.
# If status checks exist: merge only when none have failed and none (except this
# workflow) are still pending. If no other checks: merge when GitHub reports mergeable.
name: Automerge cursor PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  check_suite:
    types: [completed]

concurrency:
  group: automerge-ironstrait
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.check_suite.head_sha || github.event.pull_request.head.sha || '' }}
          THIS_WORKFLOW: Automerge cursor PRs
        run: |
          set -euo pipefail

          is_eligible() {
            local head="$1"
            local labels_json="$2"
            if [[ "$head" == cursor/* ]]; then
              return 0
            fi
            echo "$labels_json" | jq -e 'map(.name) | index("automerge") != null' >/dev/null
          }

          checks_ok() {
            # $1 = statusCheckRollup JSON array
            local rollup="$1"
            local failed pending
            failed=$(echo "$rollup" | jq --arg w "$THIS_WORKFLOW" '
              [.[] | select((.name // .context // "") != $w)
                   | select((.conclusion // "") == "FAILURE"
                         or (.conclusion // "") == "TIMED_OUT"
                         or (.conclusion // "") == "CANCELLED"
                         or (.conclusion // "") == "ACTION_REQUIRED")] | length')
            pending=$(echo "$rollup" | jq --arg w "$THIS_WORKFLOW" '
              [.[] | select((.name // .context // "") != $w)
                   | select((.state // .status // "") == "PENDING"
                         or (.state // .status // "") == "QUEUED"
                         or (.state // .status // "") == "IN_PROGRESS"
                         or ((.conclusion // null) == null and ((.state // .status // "") != "SUCCESS")))]
              | length')
            if [ "$failed" -gt 0 ]; then
              echo "    checks: $failed failed — skip"
              return 1
            fi
            if [ "$pending" -gt 0 ]; then
              echo "    checks: $pending still pending — wait"
              return 1
            fi
            echo "    checks: clear (or none besides automerge)"
            return 0
          }

          try_merge() {
            local pr="$1"
            local json head base draft state mergeable labels rollup
            json=$(gh pr view "$pr" --repo "${{ github.repository }}" \
              --json number,baseRefName,headRefName,isDraft,mergeable,state,labels,statusCheckRollup,url)
            head=$(echo "$json" | jq -r .headRefName)
            base=$(echo "$json" | jq -r .baseRefName)
            draft=$(echo "$json" | jq -r .isDraft)
            state=$(echo "$json" | jq -r .state)
            mergeable=$(echo "$json" | jq -r .mergeable)
            labels=$(echo "$json" | jq -c .labels)
            rollup=$(echo "$json" | jq -c '.statusCheckRollup // []')

            echo "→ PR #$pr ($head → $base) state=$state draft=$draft mergeable=$mergeable"

            if [ "$state" != "OPEN" ]; then
              echo "    skip: not open"
              return 0
            fi
            if [ "$base" != "main" ]; then
              echo "    skip: base is not main"
              return 0
            fi
            if [ "$draft" = "true" ]; then
              echo "    skip: draft"
              return 0
            fi
            if ! is_eligible "$head" "$labels"; then
              echo "    skip: not cursor/** and no automerge label"
              return 0
            fi
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "    skip: conflicting"
              return 0
            fi
            if [ "$mergeable" = "UNKNOWN" ]; then
              echo "    skip: mergeable unknown (retry on next event)"
              return 0
            fi
            if ! checks_ok "$rollup"; then
              return 0
            fi

            echo "    merging…"
            gh pr merge "$pr" --repo "${{ github.repository }}" --merge --delete-branch
            echo "    merged PR #$pr"
          }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            try_merge "$PR_NUMBER"
            exit 0
          fi

          # check_suite: merge any open main-bound PR whose head matches this SHA
          if [ -z "$HEAD_SHA" ]; then
            echo "No head SHA on check_suite event — nothing to do."
            exit 0
          fi
          mapfile -t prs < <(gh pr list --repo "${{ github.repository }}" --base main --state open \
            --json number,headRefOid \
            --jq ".[] | select(.headRefOid == \"$HEAD_SHA\") | .number")
          if [ "${#prs[@]}" -eq 0 ]; then
            echo "No open main PRs for SHA $HEAD_SHA"
            exit 0
          fi
          for pr in "${prs[@]}"; do
            try_merge "$pr"
          done
